apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: microservices
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS microservices_db;
    USE microservices_db;
    -- Add your schema here if needed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: microservices
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS microservices_users;
    CREATE USER IF NOT EXISTS postgres WITH PASSWORD 'changeme';
    GRANT ALL PRIVILEGES ON DATABASE microservices_users TO postgres;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "microservices_db"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: microservices
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP